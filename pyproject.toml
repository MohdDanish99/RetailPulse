[project]
name = "retail-pulse"
version = "0.1.0"
description = "RetailPulse API backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas>=2.0",
    "numpy>=1.24",
]

# Vercel finds the FastAPI app through this entry
[project.scripts]
app = "src.api.main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"dashboard/app.py" = [ "E402" ]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
