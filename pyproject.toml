[project]
name = "retail-pulse"
version = "0.1.0"
description = "RetailPulse API backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    # Add any other runtime dependencies your project needs here (e.g., pydantic, httpx)
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"dashboard/app.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "src.api.main:app"